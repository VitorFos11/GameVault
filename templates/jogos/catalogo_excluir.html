{% extends "base.html" %}
{% block title %}{{ titulo }} — GameVault{% endblock %}
{% block content %}
<div class="gv-detail-panel gv-confirm-card">
  <h1 class="gv-page-title">{{ titulo }}</h1>
  <p class="gv-page-sub">{{ objeto }} será removido permanentemente.</p>
  <p class="meta">{{ aviso }}</p>
  <form method="post" class="gv-detail-actions">
    {% csrf_token %}
    <button class="gv-btn gv-btn-danger">Confirmar exclusão</button>
    <a href="{% url voltar_url %}" class="gv-btn gv-btn-ghost">Cancelar</a>
  </form>
</div>
{% endblock %}
